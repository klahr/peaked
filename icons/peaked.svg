<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Progress Ring Gradient -->
    <linearGradient id="ring-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Drink Liquid Gradient -->
    <linearGradient id="liquid-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="45%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Glass Rim & Shine Gradient -->
    <linearGradient id="glass-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- App Icon Base (Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>

  <!-- Background Radial Glow -->
  <circle cx="256" cy="236" r="150" fill="#6366F1" opacity="0.15" filter="blur(30px)"/>

  <!-- Outer Tracking Progress Ring -->
  <g filter="url(#shadow)">
    <!-- Track Background -->
    <circle cx="256" cy="236" r="140" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="14"/>
    <!-- Active Progress Arc (Approx 70% Goal) -->
    <circle cx="256" cy="236" r="140" fill="none" stroke="url(#ring-grad)" stroke-width="14" 
            stroke-dasharray="880" stroke-dashoffset="260" stroke-linecap="round" 
            transform="rotate(-210 256 236)" filter="url(#glow)"/>
  </g>

  <!-- Central Drink Glass -->
  <g filter="url(#shadow)">
    <!-- Liquid Content -->
    <path d="M 177 210 Q 216 198 256 210 T 335 210 L 317 321 C 315 330 306 338 296 338 L 216 338 C 206 338 197 330 195 321 Z" 
          fill="url(#liquid-grad)"/>

    <!-- Liquid Top Surface Ellipse -->
    <ellipse cx="256" cy="210" rx="79" ry="10" fill="#FBBF24" opacity="0.7"/>

    <!-- Analytics / Consumption Bar Chart (Integrated in Glass Liquid) -->
    <rect x="212" y="270" width="14" height="45" rx="7" fill="#FFFFFF" opacity="0.25"/>
    <rect x="236" y="240" width="14" height="75" rx="7" fill="#FFFFFF" opacity="0.35"/>
    <rect x="260" y="225" width="14" height="90" rx="7" fill="#FFFFFF" opacity="0.55"/>
    <rect x="284" y="255" width="14" height="60" rx="7" fill="#FFFFFF" opacity="0.3"/>

    <!-- Glass Contour Outline -->
    <path d="M 166 140 L 194 322 C 197 338 210 350 226 350 L 286 350 C 302 350 315 338 318 322 L 346 140 Z" 
          fill="rgba(255, 255, 255, 0.03)" stroke="url(#glass-stroke)" stroke-width="4"/>

    <!-- Glass Rim -->
    <ellipse cx="256" cy="140" rx="90" ry="14" fill="none" stroke="url(#glass-stroke)" stroke-width="4"/>

    <!-- Glass Reflections / Highlights -->
    <path d="M 180 160 L 196 295" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5" stroke-linecap="round"/>
    <path d="M 332 160 L 322 235" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Daily Limit / Goal Line Feature -->
  <g filter="url(#glow)">
    <line x1="140" y1="195" x2="352" y2="195" stroke="#34D399" stroke-width="3" stroke-dasharray="6 6"/>
    <!-- Goal Achieved Badge -->
    <circle cx="365" cy="195" r="18" fill="#10B981" filter="url(#shadow)"/>
    <path d="M 357 195 L 363 201 L 373 189" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
